version = 1

[client]
prefix = "C-q"
escape_ms = 50

[bindings.prefix]
'\' = "split-columns"
'-' = "split-rows"
'=' = "window"
r = "reload"

[bindings.direct]
Alt-q = "detach"

[mouse]
enabled = true
resize = true
copy_on_release = true

[clipboard]
target = "osc52"
limit = 262144

[history]
lines = 50000
bytes = 67108864
total = 268435456

[workspace]
name = "workspace"
cwd = "foreground"
