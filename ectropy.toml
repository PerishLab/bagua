[comment]
allow = false

[[boundary]]
allow = ["shadow"]
note = "This isolated composition bridge translates the PTY owner's native process observation and PathBuf into the protocol owner's UTF-8 wire result. Protocol must not acquire a dependency on the native PTY adapter or an independently writable process authority. The explicit layer translation follows structure.shadow."
paths = ["crates/lib/src/host/context.rs"]

[[boundary]]
allow = ["comment"]
note = "Local SAFETY explanation for the audited post-fork pre_exec closure; only owned close-on-exec slave and async-signal-safe setsid/ioctl operations enter it."
paths = ["crates/pty/src/linux/spawn.rs"]

[[boundary]]
allow = ["word", "param"]
note = "This isolated vt100::Callbacks and vte::Perform adapter must implement upstream method names and fixed five-argument CSI callbacks. Bagua event, capture and query policy stays outside this adapter."
paths = ["crates/terminal/src/callback.rs"]

[[grant]]
paths = ["crates/*/src/**/*.rs", "crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs", "crates/cli/src/main.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = ["crates/*/src", "crates/*/tests"]

[scan]
exclude = ["**/target/**"]
include = ["crates/**/*.rs"]

[word]
single = true
