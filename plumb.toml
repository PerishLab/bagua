[identity]
ns = "bagua"

[release]
authority = "https://releases.bagua.perish.uk"
binaries = ["bagua"]
targets = ["x86_64-unknown-linux-gnu"]
skill = false

[windtun]
cases = ["bagua-workspace", "bagua-lifecycle", "bagua-flow", "bagua-config", "bagua-entry", "bagua-history", "bagua-input", "bagua-mouse", "bagua-display", "bagua-interaction"]
image = "ghcr.io/perishlab/images:stable"

[windtun.scenes]
authority = "https://depot.seatrial.perish.uk"
product = "seatrial"
channel = "stable"

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The seven terminal workspace responsibility boundaries."

[[layout.seat]]
path = ".cargo"
note = "The published domain SDK registry declaration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "The actual Rust workspace and locked dependency graph."

[[layout.file]]
name = ["README.md"]
note = "Public product introduction and contribution entry."

[[layout.file]]
name = ["bagua.toml"]
note = "An explicit runnable user configuration example, never an implicit working-directory input."
