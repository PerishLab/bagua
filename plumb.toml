[identity]
ns = "bagua"

[release]
authority = "https://releases.bagua.perish.uk"
binaries = ["bagua"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
skill = false

[windtun]
cases = ["bagua-workspace", "bagua-lifecycle", "bagua-flow", "bagua-config", "bagua-entry", "bagua-history", "bagua-input", "bagua-mouse", "bagua-display", "bagua-interaction", "bagua-exit", "bagua-observation"]
image = "ghcr.io/perishlab/images:stable"

[windtun.scenes]
authority = "https://depot.seatrial.perish.uk"
product = "seatrial"
channel = "stable"

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The seven terminal workspace responsibility boundaries."

[[layout.seat]]
path = ".cargo"
note = "The published domain SDK registry declaration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "The actual Rust workspace and locked dependency graph."

[[layout.file]]
name = ["README.md"]
note = "Public product introduction and contribution entry."

[[layout.file]]
name = ["bagua.toml"]
note = "An explicit runnable user configuration example, never an implicit working-directory input."

[windtun.services.locus]
authority = "https://releases.locus.perish.uk"
channel = "stable"

[windtun.services.locus.placement]
artifact = "linux-x64-deb"
entry = "locus-api"

[windtun.services.locus.placement.paths]
locus-api = "usr/bin/locus-api"

[[ectropy.boundary]]
allow = ["shadow"]
note = "This isolated composition bridge translates the PTY owner's native process observation and PathBuf into the protocol owner's UTF-8 wire result. Protocol must not acquire a dependency on the native PTY adapter or an independently writable process authority. The explicit layer translation follows structure.shadow."
paths = ["crates/lib/src/host/context.rs"]

[[ectropy.boundary]]
allow = ["comment"]
note = "Local SAFETY explanation for the audited post-fork pre_exec closure; only owned close-on-exec slave and async-signal-safe setsid/ioctl operations enter it."
paths = ["crates/pty/src/linux/spawn.rs"]

[[ectropy.boundary]]
allow = ["param"]
note = "This isolated vt100::Callbacks and vte::Perform adapter must implement fixed five-argument upstream CSI callbacks. Bagua event, capture and query policy stays outside this adapter."
paths = ["crates/terminal/src/callback.rs"]

[[ectropy.grant]]
paths = ["crates/cli/src/main.rs"]
syntax = "environment"