[workspace]
members = ["crates/terminal", "crates/pty", "crates/workspace", "crates/protocol", "crates/client", "crates/lib", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/bagua"
publish = false

[workspace.dependencies]
terminal = { package = "bagua-terminal", path = "crates/terminal" }
pty = { package = "bagua-pty", path = "crates/pty" }
workspace = { package = "bagua-workspace", path = "crates/workspace" }
protocol = { package = "bagua-protocol", path = "crates/protocol" }
client = { package = "bagua-client", path = "crates/client" }
bagua = { path = "crates/lib" }
clap = { version = "4", features = ["derive"] }
plumb = { version = "0", registry = "perish", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
vt100 = { version = "0.18", default-features = false }
radicula-process = { version = "0", registry = "perish" }
rustix = { version = "1", features = ["event", "fs", "net", "process", "pty", "termios"] }

crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }
unicode-width = "0.2"
